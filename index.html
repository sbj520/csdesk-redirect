<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSDesk · 跳转中…</title>
<style>body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#faf8f4;color:#333}p{text-align:center;line-height:2}a{color:#b07d3c}.err{color:#c00}</style>
</head>
<body>
<p id="msg">正在获取最新工作台地址…<br><span style="font-size:12px;color:#999">如长时间未跳转，请刷新重试</span></p>
<script>
(async function(){
  const msg = document.getElementById('msg');
  try {
    // 通过 GitHub API 实时获取最新隧道地址（绕过 Pages 部署延迟）
    const r = await fetch('https://api.github.com/repos/sbj520/csdesk-redirect/contents/tunnel-url.txt?t=' + Date.now());
    if (!r.ok) throw new Error('API ' + r.status);
    const j = await r.json();
    const url = atob(j.content.replace(/\n/g,'')).trim();
    if (!url || !(url.startsWith('https://') || url.startsWith('http://'))) throw new Error('地址格式异常');
    msg.innerHTML = '正在跳转到工作台…<br><a href="' + url + '">如未自动跳转，点这里</a>';
    location.replace(url);
  } catch(e) {
    msg.innerHTML = '<span class="err">获取地址失败：' + e.message + '</span><br>请稍后刷新重试，或联系管理员';
  }
})();
</script>
</body>
</html>
